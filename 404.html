    .error-code{margin:0;font-size:clamp(72px,16vw,150px);line-height:.9;background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;color:transparent}
    h1{margin:24px 0 10px;font-size:clamp(28px,5vw,42px)}
    p{color:var(--muted);font-size:17px;line-height:1.8}
    .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}
    .actions a{padding:13px 20px;border-radius:999px;color:#03100d;font-weight:900;text-decoration:none;background:linear-gradient(135deg,var(--green),var(--blue))}
    .actions a:last-child{color:var(--text);border:1px solid rgba(21,200,255,.22);background:rgba(255,255,255,.04)}
    @media(max-width:800px){.nav-inner{align-items:flex-start;flex-direction:column}.nav-links{overflow-x:auto;flex-wrap:nowrap;width:100%}.nav-links a{white-space:nowrap}}
